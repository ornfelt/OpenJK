# Which files of the players dir the install scripts (and inventory.py) use.
# One entry per line: <keyword> <mod dir>/<path inside it>. Paths may hold spaces; # starts a comment.
#
#   skip   - a pk3 that is not installed (an alternative variant of a pk3 that is)
#   extra  - a loose file copied into base/ next to the pk3s
#   ignore - a loose dir (an extracted copy of a pk3) that is not installed
#
# Every pk3 not listed under skip is installed.

# SWTOR Revan ships three variants of the same model; the readme calls the full one the default.
skip SWTORRevanV1-04/swtorrevan(noshader)V.1.04.pk3
skip SWTORRevanV1-04/MPSWTORRevan(noshader)V.1.04.pk3

# Luke Skywalker (Trainer) ships two variants; the readme installs "(Trainer)".
skip ZZ- Luke Skywalker Trainer v1.5/ZZ- Luke Skywalker (Trainer, TOSHI).pk3

# T_Yoda: the readme asks for Yoda.cfg in base/ (a key bind); "T_Yoda - kopia" is T_Yoda.pk3
# extracted, with body.tga renamed to body.png.
extra T_Yoda/Yoda.cfg
ignore T_Yoda/T_Yoda - kopia
