/*
	modelscale.cfg - the player model size per model, read by the OpenJK fork's game (MP and SP)
	at map load from base/ or a pk3. JA++'s format, and JA++'s own file loads unchanged:

	- whitespace-separated "model scale" pairs, the scale a factor (0.5 = half size)
	- "model" matches every skin, "model/skin" only that skin (and wins over "model")
	- line and block comments; a later line for the same model replaces an earlier one

	Players and bots: /modelscale, then this file, then the .npc scale (SP playermodel <npc>), then 1.0.
	Npcs: their own .npc scale, else this file, else 1.0.
	Installed by tools/player_mods/install_player_mods.sh; see PLAYER_MODS_STATUS.md (Sizes).
*/

